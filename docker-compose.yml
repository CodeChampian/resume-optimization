services:
  mongodb:
    image: mongo:7
    ports:
      - "27019:27017"   # Host port 27019 -> Container port 27017
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./storage:/storage
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      STORAGE_PATH: /storage
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://backend:8001
    depends_on:
      - backend

volumes:
  mongodb_data: